<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css?v=2">
    <title>SSCSPA - Down for Maintenance</title>
</head>
<body>
    <div class="maintenance-container">
        <img src="halloweenlogo.png" alt="SSCSPA Website Preview" class="site-preview">
        
        <div class="content-box">
            <h1>We'll be back soon!</h1>
            <p>
                The SSCSPA website is currently down. This could be due to daily scheduled downtime, 
                routine maintenance, or an unexpected server error. Thank you for your patience!
            </p>
            <div class="status-badge" id="status-text">Status: Checking connection...</div>
        </div>
    </div>

    <script>
        function checkSiteStatus() {
            const statusBadge = document.getElementById('status-text');
            // Add a cache-buster timestamp so the browser doesn't load a cached version
            const targetUrl = 'https://www.sscspa.co.uk/favicon.ico?_=' + Date.now();
            
            const img = new Image();

            // Triggered if the main site responds successfully with a 200 OK
            img.onload = function() {
                statusBadge.textContent = 'Status: Back online! Redirecting...';
                statusBadge.style.backgroundColor = 'rgba(34, 197, 94, 0.15)';
                statusBadge.style.color = '#4ade80';
                statusBadge.style.borderColor = 'rgba(34, 197, 94, 0.3)';

                setTimeout(() => {
                    window.location.href = 'https://www.sscspa.co.uk';
                }, 1500);
            };

            // Triggered if the site is still down (502, 1033, or offline)
            img.onerror = function() {
                statusBadge.textContent = 'Status: Maintenance (Retrying...)';
            };

            img.src = targetUrl;
        }

        // Check immediately when the page loads, then check every 10 seconds
        checkSiteStatus();
        setInterval(checkSiteStatus, 10000);
    </script>
</body>
</html>
