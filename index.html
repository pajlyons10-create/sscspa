<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css?v=2">
    <title>SSCSPA - Down for Maintenance</title>
</head>
<body>
    <div class="maintenance-container">
        <img src="halloweenlogo.png" alt="SSCSPA Website Preview" class="site-preview">
        
        <div class="content-box">
            <h1>We'll be back soon!</h1>
            <p>
                The SSCSPA website is currently down. This could be due to daily scheduled downtime, 
                routine maintenance, or an unexpected server error. Thank you for your patience!
            </p>
            <div class="status-badge" id="status-text">Status: Checking connection...</div>
        </div>
    </div>

    <script>
        async function checkSiteStatus() {
            const targetUrl = 'https://www.sscspa.co.uk';
            const statusBadge = document.getElementById('status-text');

            try {
                await fetch(targetUrl, { mode: 'no-cors', cache: 'no-store' });
                
                statusBadge.textContent = 'Status: Back online! Redirecting...';
                statusBadge.style.backgroundColor = 'rgba(34, 197, 94, 0.15)';
                statusBadge.style.color = '#4ade80';
                statusBadge.style.borderColor = 'rgba(34, 197, 94, 0.3)';

                setTimeout(() => {
                    window.location.href = targetUrl;
            } catch (error)
                statusBadge.textContent = 'Status: Maintenance (Retrying...)';
            }
        }

        checkSiteStatus();

        setInterval(checkSiteStatus, 10000);
    </script>
</body>
</html>
